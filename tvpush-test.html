<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>TV PUSH TEST</title></head>
<body style="font:12px/1.5 Courier New,monospace;background:#0a0e17;color:#9fd;background:#0a0e17">
<h3>TradingView push WS test — real browser</h3>
<div id="log" style="white-space:pre-wrap"></div>
<div id="qsd" style="white-space:pre-wrap;color:#fd0"></div>
<script>
var L=[], Q=[];
function log(s){ var d=new Date(); L.push(d.toISOString().substr(11,8)+' '+s); document.getElementById('log').textContent=L.join('\n'); }
function qsd(s){ Q.push(s); document.getElementById('qsd').textContent=Q.slice(-25).join('\n'); }

var UA=null; // browser sends its own true UA
var IDX=['NSE:NIFTY','NSE:BANKNIFTY','BSE:SENSEX','NSE:INDIAVIX'];

function mkWs(url, onopen){
  var w=new WebSocket(url);
  var t0=Date.now();
  w.onopen=function(){ log('WS OPEN ('+(Date.now()-t0)+'ms) '+url.slice(0,60)); onopen(w); };
  w.onmessage=function(ev){
    var s=String(ev.data||'');
    // engine.io frames: "0{...}", "40", "2", "3probe"... TV frames: ~m~N~m~
    var re=/~m~(\d+)~m~/g,m;
    var any=false;
    while((m=re.exec(s))){ var len=+m[1], p=s.substr(re.lastIndex,len); re.lastIndex+=len; any=true; qsd('TV: '+p.slice(0,150)); }
    if(!any) qsd('RAW: '+s.slice(0,150));
  };
  w.onerror=function(){ log('WS error '+url.slice(0,60)); };
  w.onclose=function(ev){ log('WS CLOSE code='+ev.code+' reason='+String(ev.reason||'').slice(0,60)+' after '+((Date.now()-t0)/1000).toFixed(1)+'s'); };
  return w;
}
function tvSend(w,msg){ try{ w.send('~m~'+msg.length+'~m~'+msg); }catch(e){} }

// ---- STAGE 1: direct websocket (what the dashboard does today) ----
log('STAGE 1: direct WS (transport=websocket, no sid)');
(function(){
  var w=mkWs('wss://data.tradingview.com/socket.io/?EIO=4&transport=websocket', function(w){
    var qs='qs'+Math.random().toString(36).slice(2,10);
    tvSend(w,'set_auth_token unauthorized_user_token');
    tvSend(w,'quote_create_session '+qs);
    tvSend(w,'quote_set_fields '+qs+' lp,chp,ch,open,high,low');
    tvSend(w,'quote_add_symbols '+qs+' '+IDX.join(' '));
  });
  setTimeout(function(){ try{w.close();}catch(e){} }, 20000);
})();

// ---- STAGE 2: engine.io polling handshake first (browser fetch), then upgrade ----
log('STAGE 2: polling handshake -> sid -> WS upgrade');
(async function(){
  try{
    var r=await fetch('https://data.tradingview.com/socket.io/?EIO=4&transport=polling&t='+Date.now(),{credentials:'omit'});
    var t=await r.text();
    log('STAGE2 polling HTTP '+r.status+' CT='+r.headers.get('content-type')+' body='+t.slice(0,100));
    var sid=(t.match(/"sid":"([^"]+)"/)||[])[1];
    if(!sid){ log('STAGE2 no sid extracted'); return; }
    log('STAGE2 sid ok: '+sid.slice(0,10)+'...');
    var w=mkWs('wss://data.tradingview.com/socket.io/?EIO=4&transport=websocket&sid='+encodeURIComponent(sid), function(w){
      var qs='qs'+Math.random().toString(36).slice(2,10);
      tvSend(w,'set_auth_token unauthorized_user_token');
      tvSend(w,'quote_create_session '+qs);
      tvSend(w,'quote_set_fields '+qs+' lp,chp,ch,open,high,low');
      tvSend(w,'quote_add_symbols '+qs+' '+IDX.join(' '));
    });
    setTimeout(function(){ try{w.close();}catch(e){} }, 20000);
  }catch(e){ log('STAGE2 ERR: '+e.message); }
})();

setTimeout(function(){ log('TEST WINDOW ENDS (25s)'); }, 25000);
</script>
</body></html>
